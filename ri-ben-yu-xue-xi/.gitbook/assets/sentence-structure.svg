<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">日本語の基本文型</title><desc id="desc">例文を語句ごとに分け、助詞と述語の働きを確認する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">日本語の基本文型</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">例文を語句ごとに分け、助詞と述語の働きを確認する</text>
<g font-family="sans-serif">
<text x="600" y="165" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4359">私は図書館で本を読みます。</text>
<g filter="url(#s)"><rect x="55" y="235" width="250" height="185" rx="20" fill="#e3f1ff"/></g><text x="180" y="305" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4359">私 は</text><path d="M180 330 v24" stroke="#397fc4" stroke-width="4"/><text x="180" y="390" text-anchor="middle" font-size="18" fill="#526579">話題・主題</text><g filter="url(#s)"><rect x="340" y="235" width="250" height="185" rx="20" fill="#e5f6ec"/></g><text x="465" y="305" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4359">図書館 で</text><path d="M465 330 v24" stroke="#36966d" stroke-width="4"/><text x="465" y="390" text-anchor="middle" font-size="18" fill="#526579">動作をする場所</text><g filter="url(#s)"><rect x="625" y="235" width="250" height="185" rx="20" fill="#fff0df"/></g><text x="750" y="305" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4359">本 を</text><path d="M750 330 v24" stroke="#d9943c" stroke-width="4"/><text x="750" y="390" text-anchor="middle" font-size="18" fill="#526579">動作の対象</text><g filter="url(#s)"><rect x="910" y="235" width="250" height="185" rx="20" fill="#f0eaff"/></g><text x="1035" y="305" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4359">読みます。</text><path d="M1035 330 v24" stroke="#8066bf" stroke-width="4"/><text x="1035" y="390" text-anchor="middle" font-size="18" fill="#526579">述語・動作</text>
<rect x="130" y="485" width="940" height="105" rx="18" fill="#fff" stroke="#d8e1ea" stroke-width="2"/>
<text x="600" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="#40566e">基本の考え方</text>
<text x="600" y="562" text-anchor="middle" font-size="18" fill="#64748b">話題・場所・対象などを助詞で示し、文末の述語で文をまとめます。</text>
</g></svg>