<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">時制・アスペクトの基本</title><desc id="desc">動作がいつ起きるか、どの段階にあるかを表現する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">時制・アスペクトの基本</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">動作がいつ起きるか、どの段階にあるかを表現する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="80" y="155" width="1040" height="440" rx="24" fill="#fff"/></g>
<text x="600" y="215" text-anchor="middle" font-size="28" font-weight="700" fill="#334155">読む を使った表現の比較</text>
<rect x="135" y="260" width="930" height="62" rx="12" fill="#e3f1ff"/><text x="175" y="300" font-size="22" font-weight="700" fill="#334155">読みます</text><text x="475" y="300" font-size="18" font-weight="700" fill="#456783">非過去</text><text x="690" y="300" font-size="16" fill="#526579">習慣・現在の事実・未来の予定</text><rect x="135" y="338" width="930" height="62" rx="12" fill="#e5f6ec"/><text x="175" y="378" font-size="22" font-weight="700" fill="#334155">読みました</text><text x="475" y="378" font-size="18" font-weight="700" fill="#456783">過去</text><text x="690" y="378" font-size="16" fill="#526579">過去に行った動作・出来事</text><rect x="135" y="416" width="930" height="62" rx="12" fill="#fff0df"/><text x="175" y="456" font-size="22" font-weight="700" fill="#334155">読んでいます</text><text x="475" y="456" font-size="18" font-weight="700" fill="#456783">進行・状態</text><text x="690" y="456" font-size="16" fill="#526579">今読んでいる／状態が続いている</text><rect x="135" y="494" width="930" height="62" rx="12" fill="#f0eaff"/><text x="175" y="534" font-size="22" font-weight="700" fill="#334155">読んでいました</text><text x="475" y="534" font-size="18" font-weight="700" fill="#456783">過去の進行・状態</text><text x="690" y="534" font-size="16" fill="#526579">過去のある時点で続いていた動作</text>
<text x="600" y="650" text-anchor="middle" font-size="18" fill="#64748b">「ます形」は未来だけを示す形ではありません。時間表現や文脈と合わせて理解します。</text>
</g></svg>