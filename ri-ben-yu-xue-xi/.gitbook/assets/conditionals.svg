<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">条件表現：と・ば・たら・なら</title><desc id="desc">条件の意味や後ろに続く内容に合わせて使い分ける</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">条件表現：と・ば・たら・なら</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">条件の意味や後ろに続く内容に合わせて使い分ける</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="70" y="155" width="500" height="190" rx="20" fill="#e3f1ff"/></g><text x="130" y="225" font-size="42" font-weight="800" fill="#334155">と</text><text x="225" y="215" font-size="22" font-weight="700" fill="#456783">自然な結果・反復</text><text x="130" y="290" font-size="18" fill="#526579">春になると、桜が咲きます。</text><g filter="url(#s)"><rect x="610" y="155" width="500" height="190" rx="20" fill="#e5f6ec"/></g><text x="670" y="225" font-size="42" font-weight="800" fill="#334155">ば</text><text x="765" y="215" font-size="22" font-weight="700" fill="#456783">一般的な条件</text><text x="670" y="290" font-size="18" fill="#526579">時間があれば、行きます。</text><g filter="url(#s)"><rect x="70" y="390" width="500" height="190" rx="20" fill="#fff0df"/></g><text x="130" y="460" font-size="42" font-weight="800" fill="#334155">たら</text><text x="225" y="450" font-size="22" font-weight="700" fill="#456783">成立後・仮定</text><text x="130" y="525" font-size="18" fill="#526579">家に帰ったら、連絡します。</text><g filter="url(#s)"><rect x="610" y="390" width="500" height="190" rx="20" fill="#f0eaff"/></g><text x="670" y="460" font-size="42" font-weight="800" fill="#334155">なら</text><text x="765" y="450" font-size="22" font-weight="700" fill="#456783">話題・前提を受ける</text><text x="670" y="525" font-size="18" fill="#526579">日本へ行くなら、京都もおすすめです。</text>
<text x="600" y="670" text-anchor="middle" font-size="18" fill="#64748b">実際の使い分けには例外や文脈があります。後件の表現にも注目しましょう。</text>
</g></svg>