<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">感情・気持ちを表す語彙</title><desc id="desc">感情語は、意味だけでなく強さや場面の違いも意識する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">感情・気持ちを表す語彙</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">感情語は、意味だけでなく強さや場面の違いも意識する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="65" y="150" width="320" height="205" rx="20" fill="#ffe8c7"/></g><circle cx="130" cy="220" r="34" fill="#fff"/><text x="130" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">☺</text><text x="240" y="225" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">うれしい</text><text x="225" y="292" text-anchor="middle" font-size="18" fill="#526579">喜びを感じる</text><g filter="url(#s)"><rect x="435" y="150" width="320" height="205" rx="20" fill="#e2f3e8"/></g><circle cx="500" cy="220" r="34" fill="#fff"/><text x="500" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">✓</text><text x="610" y="225" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">安心する</text><text x="595" y="292" text-anchor="middle" font-size="18" fill="#526579">心配がなくなる</text><g filter="url(#s)"><rect x="805" y="150" width="320" height="205" rx="20" fill="#e5edff"/></g><circle cx="870" cy="220" r="34" fill="#fff"/><text x="870" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">…</text><text x="980" y="225" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">不安</text><text x="965" y="292" text-anchor="middle" font-size="18" fill="#526579">心配で落ち着かない</text><g filter="url(#s)"><rect x="65" y="400" width="320" height="205" rx="20" fill="#f4eaff"/></g><circle cx="130" cy="470" r="34" fill="#fff"/><text x="130" y="482" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">!</text><text x="240" y="475" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">驚く</text><text x="225" y="542" text-anchor="middle" font-size="18" fill="#526579">予想外のことに反応する</text><g filter="url(#s)"><rect x="435" y="400" width="320" height="205" rx="20" fill="#fff0f0"/></g><circle cx="500" cy="470" r="34" fill="#fff"/><text x="500" y="482" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">?</text><text x="610" y="475" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">困る</text><text x="595" y="542" text-anchor="middle" font-size="18" fill="#526579">どうすればよいか迷う</text><g filter="url(#s)"><rect x="805" y="400" width="320" height="205" rx="20" fill="#ffe5e5"/></g><circle cx="870" cy="470" r="34" fill="#fff"/><text x="870" y="482" text-anchor="middle" font-size="30" font-weight="700" fill="#50657a">！</text><text x="980" y="475" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">怒る</text><text x="965" y="542" text-anchor="middle" font-size="18" fill="#526579">不快なことに強く反応する</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">例文を作るときは、感情を感じた理由や状況も合わせて表現しましょう。</text>
</g></svg>