ill="#fff">N2</text><text x="847" y="325" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">幅広い場面</text><text x="847" y="385" text-anchor="middle" font-size="17" fill="#526579">新聞・説明・自然な会話</text><path d="M847 425 V465" stroke="#a899d3" stroke-width="5" stroke-linecap="round"/><circle cx="847" cy="480" r="10" fill="#a899d3"/><g filter="url(#s)"><rect x="975" y="180" width="205" height="340" rx="20" fill="#fff0f0"/></g><rect x="1000" y="210" width="155" height="58" rx="15" fill="#d48a91"/><text x="1077" y="249" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">N1</text><text x="1077" y="325" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">高度な理解</text><text x="1077" y="385" text-anchor="middle" font-size="17" fill="#526579">抽象的・複雑な内容</text><path d="M1077 425 V465" stroke="#d48a91" stroke-width="5" stroke-linecap="round"/><circle cx="1077" cy="480" r="10" fill="#d48a91"/>
<text x="600" y="610" text-anchor="middle" font-size="19" fill="#64748b">この図は学習の目安です。公式の試験内容・出題範囲を網羅する一覧ではありません。</text>
