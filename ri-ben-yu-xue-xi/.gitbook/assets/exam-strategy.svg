<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">試験問題に取り組む手順</title><desc id="desc">焦らず設問を読み、確実に解ける問題から進める</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">試験問題に取り組む手順</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">焦らず設問を読み、確実に解ける問題から進める</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="85" y="155" width="455" height="175" rx="22" fill="#e3f1ff"/></g><circle cx="155" cy="225" r="32" fill="#fff"/><text x="155" y="236" text-anchor="middle" font-size="25" font-weight="700" fill="#456783">1</text><text x="220" y="220" font-size="27" font-weight="700" fill="#334155">読む</text><text x="220" y="270" font-size="18" fill="#526579">指示と設問を先に確認</text><g filter="url(#s)"><rect x="620" y="155" width="455" height="175" rx="22" fill="#e5f6ec"/></g><circle cx="690" cy="225" r="32" fill="#fff"/><text x="690" y="236" text-anchor="middle" font-size="25" font-weight="700" fill="#456783">2</text><text x="755" y="220" font-size="27" font-weight="700" fill="#334155">解く</text><text x="755" y="270" font-size="18" fill="#526579">根拠を探し、選択肢を比較</text><g filter="url(#s)"><rect x="85" y="385" width="455" height="175" rx="22" fill="#fff0df"/></g><circle cx="155" cy="455" r="32" fill="#fff"/><text x="155" y="466" text-anchor="middle" font-size="25" font-weight="700" fill="#456783">3</text><text x="220" y="450" font-size="27" font-weight="700" fill="#334155">印を付ける</text><text x="220" y="500" font-size="18" fill="#526579">迷う問題を後で見直せるようにする</text><g filter="url(#s)"><rect x="620" y="385" width="455" height="175" rx="22" fill="#f0eaff"/></g><circle cx="690" cy="455" r="32" fill="#fff"/><text x="690" y="466" text-anchor="middle" font-size="25" font-weight="700" fill="#456783">4</text><text x="755" y="450" font-size="27" font-weight="700" fill="#334155">見直す</text><text x="755" y="500" font-size="18" fill="#526579">残り時間と解答欄を確認</text>
<text x="600" y="660" text-anchor="middle" font-size="18" fill="#64748b">実際の時間配分は、受験級と当日の試験案内に従って調整してください。</text>
</g></svg>