<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">聴解：聞く前・聞く時・聞いた後</title><desc id="desc">設問を手がかりに、必要な情報を予測しながら聞く</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">聴解：聞く前・聞く時・聞いた後</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">設問を手がかりに、必要な情報を予測しながら聞く</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="95" y="190" width="320" height="310" rx="22" fill="#e3f1ff"/></g><circle cx="255" cy="265" r="48" fill="#fff"/><text x="255" y="278" text-anchor="middle" font-size="30" font-weight="800" fill="#456783">1</text><text x="255" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">聞く前</text><text x="255" y="425" text-anchor="middle" font-size="18" fill="#526579">設問と選択肢を読み、場面を予測する</text><path d="M420 345 h35 m-12 -12 l12 12 -12 12" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="460" y="190" width="320" height="310" rx="22" fill="#e5f6ec"/></g><circle cx="620" cy="265" r="48" fill="#fff"/><text x="620" y="278" text-anchor="middle" font-size="30" font-weight="800" fill="#456783">2</text><text x="620" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">聞いている時</text><text x="620" y="425" text-anchor="middle" font-size="18" fill="#526579">話者・目的・数字・変化に注意する</text><path d="M420 345 h35 m-12 -12 l12 12 -12 12" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="825" y="190" width="320" height="310" rx="22" fill="#fff0df"/></g><circle cx="985" cy="265" r="48" fill="#fff"/><text x="985" y="278" text-anchor="middle" font-size="30" font-weight="800" fill="#456783">3</text><text x="985" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">聞いた後</text><text x="985" y="425" text-anchor="middle" font-size="18" fill="#526579">聞き取った根拠と選択肢を照合する</text>
<text x="600" y="625" text-anchor="middle" font-size="20" fill="#64748b">一語だけに集中せず、会話全体の目的と流れを捉えましょう。</text>
</g></svg>