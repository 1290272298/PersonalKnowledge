<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">動詞の分類と活用</title><desc id="desc">動詞は大きく3つのグループに分け、辞書形と活用形を比べて覚える</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">動詞の分類と活用</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">動詞は大きく3つのグループに分け、辞書形と活用形を比べて覚える</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="85" y="160" width="1030" height="125" rx="20" fill="#e3f1ff"/></g><text x="130" y="207" font-size="24" font-weight="700" fill="#334155">グループ1（五段）</text><text x="500" y="207" font-size="25" font-weight="700" fill="#456783">書く → 書きます → 書いて</text><text x="500" y="248" font-size="17" fill="#526579">語尾が変化する</text><g filter="url(#s)"><rect x="85" y="315" width="1030" height="125" rx="20" fill="#e5f6ec"/></g><text x="130" y="362" font-size="24" font-weight="700" fill="#334155">グループ2（一段）</text><text x="500" y="362" font-size="25" font-weight="700" fill="#456783">食べる → 食べます → 食べて</text><text x="500" y="403" font-size="17" fill="#526579">「る」を取って形を作る</text><g filter="url(#s)"><rect x="85" y="470" width="1030" height="125" rx="20" fill="#fff0df"/></g><text x="130" y="517" font-size="24" font-weight="700" fill="#334155">グループ3（不規則）</text><text x="500" y="517" font-size="25" font-weight="700" fill="#456783">する → します → して</text><text x="500" y="558" font-size="17" fill="#526579">する・来るなど</text>
<text x="600" y="665" text-anchor="middle" font-size="18" fill="#64748b">「来る」はグループ3の不規則動詞です。活用は辞書形ごとに確認しましょう。</text>
</g></svg>