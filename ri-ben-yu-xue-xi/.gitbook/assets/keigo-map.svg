<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">敬語の基本：誰の行動を表すか</title><desc id="desc">相手側の行動か、自分側の行動かを意識して表現を選ぶ</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">敬語の基本：誰の行動を表すか</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">相手側の行動か、自分側の行動かを意識して表現を選ぶ</text>
<g font-family="sans-serif">
<text x="600" y="165" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">基本動詞「行く」の表現例</text>
<g filter="url(#s)"><rect x="75" y="220" width="320" height="300" rx="22" fill="#e3f1ff"/></g><rect x="110" y="255" width="250" height="55" rx="15" fill="#4b8bc8"/><text x="235" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">尊敬語</text><text x="235" y="370" text-anchor="middle" font-size="18" fill="#526579">相手側の行動</text><rect x="110" y="410" width="250" height="65" rx="12" fill="#fff"/><text x="235" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">いらっしゃいます</text><g filter="url(#s)"><rect x="440" y="220" width="320" height="300" rx="22" fill="#e5f6ec"/></g><rect x="475" y="255" width="250" height="55" rx="15" fill="#4d9d79"/><text x="600" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">謙譲語</text><text x="600" y="370" text-anchor="middle" font-size="18" fill="#526579">自分側の行動</text><rect x="475" y="410" width="250" height="65" rx="12" fill="#fff"/><text x="600" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">伺います</text><g filter="url(#s)"><rect x="805" y="220" width="320" height="300" rx="22" fill="#fff0df"/></g><rect x="840" y="255" width="250" height="55" rx="15" fill="#d79b48"/><text x="965" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">丁寧語</text><text x="965" y="370" text-anchor="middle" font-size="18" fill="#526579">聞き手に丁寧に伝える</text><rect x="840" y="410" width="250" height="65" rx="12" fill="#fff"/><text x="965" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">行きます</text>
<text x="600" y="630" text-anchor="middle" font-size="19" fill="#64748b">尊敬語は相手を高め、謙譲語は自分側の行動をへりくだって表します。</text>
</g></svg>