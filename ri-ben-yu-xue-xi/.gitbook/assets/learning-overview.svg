<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">日本語学習ガイド</title>
<desc id="desc">日本語の基礎から実践まで、九つの学習分野を紹介するオリジナルの教育用イラスト</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff8ef"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3f1ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f6ec"/><stop offset="1" stop-color="#f6fbf7"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0eaff"/><stop offset="1" stop-color="#fbf8ff"/></linearGradient>
  <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0df"/><stop offset="1" stop-color="#fffaf4"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#334155" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="800" y="76" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="48" font-weight="800" fill="#24364b">日本語学習ガイド</text>
<text x="800" y="116" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="22" fill="#64748b">基礎から実践まで、9つの分野で学ぶ</text>
<!-- card 1 -->
<g filter="url(#shadow)"><rect x="48" y="155" width="480" height="205" rx="26" fill="url(#blue)"/></g>
<rect x="76" y="180" width="200" height="42" rx="21" fill="#397fc4"/>
<text x="176" y="209" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="22" font-weight="700" fill="#fff">01 基礎</text>
<text x="82" y="282" font-family="'Noto Sans JP',sans-serif" font-size="48" font-weight="700" fill="#234d78">あ い う え お</text>
<text x="82" y="324" font-family="'Noto Sans JP',sans-serif" font-size="22" fill="#456783">文字・発音・基本文型</text>
