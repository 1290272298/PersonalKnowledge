<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">読解：文章の流れをつかむ</title><desc id="desc">段落の役割を考えながら読むと、筆者の主張と根拠を整理しやすい</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">読解：文章の流れをつかむ</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">段落の役割を考えながら読むと、筆者の主張と根拠を整理しやすい</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="125" y="145" width="950" height="95" rx="18" fill="#e3f1ff"/></g><circle cx="195" cy="192" r="27" fill="#fff"/><text x="195" y="201" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">1</text><text x="255" y="185" font-size="24" font-weight="700" fill="#334155">話題・導入</text><text x="590" y="188" font-size="18" fill="#526579">何について述べる文章か</text><path d="M600 240 v22 m-10 -10 l10 12 10 -12" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="125" y="270" width="950" height="95" rx="18" fill="#e5f6ec"/></g><circle cx="195" cy="317" r="27" fill="#fff"/><text x="195" y="326" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">2</text><text x="255" y="310" font-size="24" font-weight="700" fill="#334155">主張・要点</text><text x="590" y="313" font-size="18" fill="#526579">筆者が最も伝えたいこと</text><path d="M600 365 v22 m-10 -10 l10 12 10 -12" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="125" y="395" width="950" height="95" rx="18" fill="#fff0df"/></g><circle cx="195" cy="442" r="27" fill="#fff"/><text x="195" y="451" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">3</text><text x="255" y="435" font-size="24" font-weight="700" fill="#334155">理由・具体例</text><text x="590" y="438" font-size="18" fill="#526579">主張を支える説明や事例</text><path d="M600 490 v22 m-10 -10 l10 12 10 -12" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="125" y="520" width="950" height="95" rx="18" fill="#f0eaff"/></g><circle cx="195" cy="567" r="27" fill="#fff"/><text x="195" y="576" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">4</text><text x="255" y="560" font-size="24" font-weight="700" fill="#334155">まとめ</text><text x="590" y="563" font-size="18" fill="#526579">内容を整理し、結論を示す</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">文章によって構成は異なります。接続表現や指示語にも注目しましょう。</text>
</g></svg>