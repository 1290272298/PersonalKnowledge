<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">よく使う助詞の役割</title><desc id="desc">助詞は前後の語句の関係を示す。代表的な使い方を例文で確認する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">よく使う助詞の役割</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">助詞は前後の語句の関係を示す。代表的な使い方を例文で確認する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="55" y="150" width="250" height="205" rx="20" fill="#e3f1ff"/></g><text x="180" y="215" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">は</text><text x="180" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">話題・主題</text><text x="180" y="315" text-anchor="middle" font-size="17" fill="#40566e">私は学生です。</text><g filter="url(#s)"><rect x="340" y="150" width="250" height="205" rx="20" fill="#e5f6ec"/></g><text x="465" y="215" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">が</text><text x="465" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">主語・焦点</text><text x="465" y="315" text-anchor="middle" font-size="17" fill="#40566e">雨が降っています。</text><g filter="url(#s)"><rect x="625" y="150" width="250" height="205" rx="20" fill="#fff0df"/></g><text x="750" y="215" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">を</text><text x="750" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">動作の対象</text><text x="750" y="315" text-anchor="middle" font-size="17" fill="#40566e">本を読みます。</text><g filter="url(#s)"><rect x="910" y="150" width="250" height="205" rx="20" fill="#f0eaff"/></g><text x="1035" y="215" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">に</text><text x="1035" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">時・到着点など</text><text x="1035" y="315" text-anchor="middle" font-size="17" fill="#40566e">7時に起きます。</text><g filter="url(#s)"><rect x="55" y="400" width="250" height="205" rx="20" fill="#e3f1ff"/></g><text x="180" y="465" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">で</text><text x="180" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">動作の場所・手段</text><text x="180" y="565" text-anchor="middle" font-size="17" fill="#40566e">図書館で勉強します。</text><g filter="url(#s)"><rect x="340" y="400" width="250" height="205" rx="20" fill="#e5f6ec"/></g><text x="465" y="465" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">へ</text><text x="465" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">方向</text><text x="465" y="565" text-anchor="middle" font-size="17" fill="#40566e">学校へ行きます。</text><g filter="url(#s)"><rect x="625" y="400" width="250" height="205" rx="20" fill="#fff0df"/></g><text x="750" y="465" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">と</text><text x="750" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">相手・引用など</text><text x="750" y="565" text-anchor="middle" font-size="17" fill="#40566e">友達と話します。</text><g filter="url(#s)"><rect x="910" y="400" width="250" height="205" rx="20" fill="#f0eaff"/></g><text x="1035" y="465" text-anchor="middle" font-size="46" font-weight="800" fill="#334155">も</text><text x="1035" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#526579">追加・同類</text><text x="1035" y="565" text-anchor="middle" font-size="17" fill="#40566e">私も行きます。</text>
<text x="600" y="680" text-anchor="middle" font-size="18" fill="#64748b">助詞の意味は文脈で変わります。ここでは代表的な使い方を示しています。</text>
</g></svg>