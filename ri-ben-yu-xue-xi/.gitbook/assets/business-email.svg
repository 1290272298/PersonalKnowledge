<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ビジネスメールの基本構成</title><desc id="desc">相手・用件・依頼内容が伝わるように、要素を順番に整理する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">ビジネスメールの基本構成</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">相手・用件・依頼内容が伝わるように、要素を順番に整理する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="110" y="145" width="980" height="495" rx="24" fill="#fff"/></g>
<rect x="150" y="180" width="900" height="58" rx="12" fill="#e3f1ff"/><text x="180" y="217" font-size="22" font-weight="700" fill="#315f91">件名：内容が分かる短いタイトル</text>
<rect x="150" y="260" width="900" height="43" rx="10" fill="#f2f7fb"/><text x="180" y="289" font-size="19" font-weight="700" fill="#334155">宛名</text><text x="390" y="289" font-size="18" fill="#526579">会社名・部署名・氏名</text><rect x="150" y="314" width="900" height="43" rx="10" fill="#f8fafc"/><text x="180" y="343" font-size="19" font-weight="700" fill="#334155">挨拶</text><text x="390" y="343" font-size="18" fill="#526579">お世話になっております。</text><rect x="150" y="368" width="900" height="43" rx="10" fill="#f2f7fb"/><text x="180" y="397" font-size="19" font-weight="700" fill="#334155">要件</text><text x="390" y="397" font-size="18" fill="#526579">連絡・報告・依頼の目的を明確にする</text><rect x="150" y="422" width="900" height="43" rx="10" fill="#f8fafc"/><text x="180" y="451" font-size="19" font-weight="700" fill="#334155">詳細</text><text x="390" y="451" font-size="18" fill="#526579">必要な情報を簡潔に整理する</text><rect x="150" y="476" width="900" height="43" rx="10" fill="#f2f7fb"/><text x="180" y="505" font-size="19" font-weight="700" fill="#334155">結び</text><text x="390" y="505" font-size="18" fill="#526579">ご確認のほど、よろしくお願いいたします。</text><rect x="150" y="530" width="900" height="43" rx="10" fill="#f8fafc"/><text x="180" y="559" font-size="19" font-weight="700" fill="#334155">署名</text><text x="390" y="559" font-size="18" fill="#526579">氏名・所属・連絡先</text>
</g></svg>