<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">日本語の語彙：品詞で整理する</title><desc id="desc">単語の働きを知ると、文の中での使い方が分かりやすくなる</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">日本語の語彙：品詞で整理する</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">単語の働きを知ると、文の中での使い方が分かりやすくなる</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="65" y="150" width="320" height="205" rx="20" fill="#e3f1ff"/></g><text x="225" y="210" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">名詞</text><text x="225" y="255" text-anchor="middle" font-size="18" fill="#526579">人・物・こと</text><text x="225" y="315" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">学生／本／時間</text><g filter="url(#s)"><rect x="435" y="150" width="320" height="205" rx="20" fill="#e5f6ec"/></g><text x="595" y="210" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">動詞</text><text x="595" y="255" text-anchor="middle" font-size="18" fill="#526579">動作・状態</text><text x="595" y="315" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">読む／行く／ある</text><g filter="url(#s)"><rect x="805" y="150" width="320" height="205" rx="20" fill="#fff0df"/></g><text x="965" y="210" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">い形容詞</text><text x="965" y="255" text-anchor="middle" font-size="18" fill="#526579">性質・状態</text><text x="965" y="315" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">高い／新しい</text><g filter="url(#s)"><rect x="65" y="400" width="320" height="205" rx="20" fill="#f0eaff"/></g><text x="225" y="460" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">な形容詞</text><text x="225" y="505" text-anchor="middle" font-size="18" fill="#526579">性質・状態</text><text x="225" y="565" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">静か（な）／便利（な）</text><g filter="url(#s)"><rect x="435" y="400" width="320" height="205" rx="20" fill="#fff0f0"/></g><text x="595" y="460" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">副詞</text><text x="595" y="505" text-anchor="middle" font-size="18" fill="#526579">動詞などを詳しく説明</text><text x="595" y="565" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">ゆっくり／とても</text><g filter="url(#s)"><rect x="805" y="400" width="320" height="205" rx="20" fill="#e3f1ff"/></g><text x="965" y="460" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">助詞</text><text x="965" y="505" text-anchor="middle" font-size="18" fill="#526579">語句の関係を示す</text><text x="965" y="565" text-anchor="middle" font-size="22" font-weight="700" fill="#456783">は／が／を／に</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">品詞の分類や活用の有無を、例文の中で確認しましょう。</text>
</g></svg>