<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">日本語の発音：4つのポイント</title><desc id="desc">音の長さや区切りを意識すると、意味の違いが聞き取りやすくなる</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">日本語の発音：4つのポイント</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">音の長さや区切りを意識すると、意味の違いが聞き取りやすくなる</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="70" y="155" width="500" height="205" rx="22" fill="#e8f2ff"/></g><circle cx="130" cy="215" r="30" fill="#fff" stroke="#9bb0c4" stroke-width="3"/><text x="130" y="225" text-anchor="middle" font-size="25" font-weight="700" fill="#40566e">1</text><text x="185" y="222" font-size="26" font-weight="700" fill="#334155">拍（モーラ）</text><text x="110" y="280" font-size="18" fill="#526579">日本語は拍のリズムを意識する</text><text x="110" y="325" font-size="25" font-weight="700" fill="#3e6684">に・ほ・ん（3拍）</text><g filter="url(#s)"><rect x="610" y="155" width="500" height="205" rx="22" fill="#e8f6ee"/></g><circle cx="670" cy="215" r="30" fill="#fff" stroke="#9bb0c4" stroke-width="3"/><text x="670" y="225" text-anchor="middle" font-size="25" font-weight="700" fill="#40566e">2</text><text x="725" y="222" font-size="26" font-weight="700" fill="#334155">長音</text><text x="650" y="280" font-size="18" fill="#526579">母音を一拍分のばす</text><text x="650" y="325" font-size="25" font-weight="700" fill="#3e6684">おばさん ／ おばあさん</text><g filter="url(#s)"><rect x="70" y="405" width="500" height="205" rx="22" fill="#fff1df"/></g><circle cx="130" cy="465" r="30" fill="#fff" stroke="#9bb0c4" stroke-width="3"/><text x="130" y="475" text-anchor="middle" font-size="25" font-weight="700" fill="#40566e">3</text><text x="185" y="472" font-size="26" font-weight="700" fill="#334155">促音</text><text x="110" y="530" font-size="18" fill="#526579">小さい「っ」で一拍止める</text><text x="110" y="575" font-size="25" font-weight="700" fill="#3e6684">きて ／ きって</text><g filter="url(#s)"><rect x="610" y="405" width="500" height="205" rx="22" fill="#f0eaff"/></g><circle cx="670" cy="465" r="30" fill="#fff" stroke="#9bb0c4" stroke-width="3"/><text x="670" y="475" text-anchor="middle" font-size="25" font-weight="700" fill="#40566e">4</text><text x="725" y="472" font-size="26" font-weight="700" fill="#334155">撥音</text><text x="650" y="530" font-size="18" fill="#526579">「ん」も一拍として数える</text><text x="650" y="575" font-size="25" font-weight="700" fill="#3e6684">し・ん・ぶ・ん（4拍）</text>
<text x="600" y="690" text-anchor="middle" font-size="19" fill="#64748b">発音練習では、文字だけでなく音声を聞き、声に出して確認しましょう。</text>
</g></svg>