<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">シャドーイングの練習手順</title><desc id="desc">音声を聞き、少し遅れて声に出す練習を段階的に行う</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">シャドーイングの練習手順</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">音声を聞き、少し遅れて声に出す練習を段階的に行う</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="75" y="155" width="490" height="185" rx="22" fill="#e3f1ff"/></g><circle cx="145" cy="220" r="32" fill="#fff"/><text x="145" y="230" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">1</text><text x="210" y="215" font-size="24" font-weight="700" fill="#334155">まず聞く</text><text x="210" y="270" font-size="17" fill="#526579">全体の意味と話す速さを確認</text><g filter="url(#s)"><rect x="615" y="155" width="490" height="185" rx="22" fill="#e5f6ec"/></g><circle cx="685" cy="220" r="32" fill="#fff"/><text x="685" y="230" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">2</text><text x="750" y="215" font-size="24" font-weight="700" fill="#334155">スクリプトで確認</text><text x="750" y="270" font-size="17" fill="#526579">知らない語や音のつながりを確認</text><g filter="url(#s)"><rect x="75" y="390" width="490" height="185" rx="22" fill="#fff0df"/></g><circle cx="145" cy="455" r="32" fill="#fff"/><text x="145" y="465" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">3</text><text x="210" y="450" font-size="24" font-weight="700" fill="#334155">音声に続いて話す</text><text x="210" y="505" font-size="17" fill="#526579">音声から少し遅れて発音する</text><g filter="url(#s)"><rect x="615" y="390" width="490" height="185" rx="22" fill="#f0eaff"/></g><circle cx="685" cy="455" r="32" fill="#fff"/><text x="685" y="465" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">4</text><text x="750" y="450" font-size="24" font-weight="700" fill="#334155">録音して比べる</text><text x="750" y="505" font-size="17" fill="#526579">リズム・区切り・発音を振り返る</text>
<text x="600" y="665" text-anchor="middle" font-size="18" fill="#64748b">短い音声から始め、無理のない速度と回数で繰り返しましょう。</text>
</g></svg>