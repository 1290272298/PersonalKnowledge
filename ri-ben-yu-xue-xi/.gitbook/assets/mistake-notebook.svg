<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">間違いノートの作り方</title><desc id="desc">正解を書き写すだけでなく、間違えた理由と次に使う方法を残す</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">間違いノートの作り方</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">正解を書き写すだけでなく、間違えた理由と次に使う方法を残す</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="115" y="145" width="970" height="500" rx="24" fill="#fff"/></g>
<rect x="155" y="190" width="890" height="62" rx="12" fill="#e3f1ff"/><text x="190" y="228" font-size="21" font-weight="700" fill="#334155">問題・テーマ</text><text x="500" y="228" font-size="18" fill="#526579">何を間違えたか</text><rect x="155" y="272" width="890" height="62" rx="12" fill="#f4f7fa"/><text x="190" y="310" font-size="21" font-weight="700" fill="#334155">自分の答え</text><text x="500" y="310" font-size="18" fill="#526579">どう考えて答えたか</text><rect x="155" y="354" width="890" height="62" rx="12" fill="#e3f1ff"/><text x="190" y="392" font-size="21" font-weight="700" fill="#334155">正解・根拠</text><text x="500" y="392" font-size="18" fill="#526579">正しい答えと判断の理由</text><rect x="155" y="436" width="890" height="62" rx="12" fill="#f4f7fa"/><text x="190" y="474" font-size="21" font-weight="700" fill="#334155">間違いの原因</text><text x="500" y="474" font-size="18" fill="#526579">語彙不足・文法理解・読み違いなど</text><rect x="155" y="518" width="890" height="62" rx="12" fill="#e3f1ff"/><text x="190" y="556" font-size="21" font-weight="700" fill="#334155">次の復習日</text><text x="500" y="556" font-size="18" fill="#526579">もう一度解く日を決める</text>
<text x="600" y="625" text-anchor="middle" font-size="18" fill="#64748b">同じ間違いを減らすために、復習後にもう一度自分で解いてみましょう。</text>
</g></svg>