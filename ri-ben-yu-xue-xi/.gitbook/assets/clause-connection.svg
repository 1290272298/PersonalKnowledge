<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">文と文をつなぐ表現</title><desc id="desc">理由・逆接・並列など、関係に合った接続表現を選ぶ</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">文と文をつなぐ表現</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">理由・逆接・並列など、関係に合った接続表現を選ぶ</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="75" y="150" width="1050" height="95" rx="18" fill="#e3f1ff"/></g><text x="125" y="190" font-size="23" font-weight="700" fill="#334155">理由</text><text x="355" y="190" font-size="21" font-weight="700" fill="#456783">ので／から</text><text x="570" y="190" font-size="18" fill="#526579">雨が降っているので、出かけません。</text><g filter="url(#s)"><rect x="75" y="275" width="1050" height="95" rx="18" fill="#e5f6ec"/></g><text x="125" y="315" font-size="23" font-weight="700" fill="#334155">逆接</text><text x="355" y="315" font-size="21" font-weight="700" fill="#456783">が／けれども</text><text x="570" y="315" font-size="18" fill="#526579">時間がありませんが、行きます。</text><g filter="url(#s)"><rect x="75" y="400" width="1050" height="95" rx="18" fill="#fff0df"/></g><text x="125" y="440" font-size="23" font-weight="700" fill="#334155">並列・順序</text><text x="355" y="440" font-size="21" font-weight="700" fill="#456783">て形</text><text x="570" y="440" font-size="18" fill="#526579">朝ご飯を食べて、学校へ行きます。</text><g filter="url(#s)"><rect x="75" y="525" width="1050" height="95" rx="18" fill="#f0eaff"/></g><text x="125" y="565" font-size="23" font-weight="700" fill="#334155">追加説明</text><text x="355" y="565" font-size="21" font-weight="700" fill="#456783">し</text><text x="570" y="565" font-size="18" fill="#526579">この店は安いし、おいしいです。</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">接続表現によって文の意味や話し手の気持ちが変わるため、例文全体で覚えましょう。</text>
</g></svg>