<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">漢字の筆順：基本の原則</title><desc id="desc">代表的な筆順の考え方を確認し、実際の漢字では辞書などで個別に確認する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">漢字の筆順：基本の原則</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">代表的な筆順の考え方を確認し、実際の漢字では辞書などで個別に確認する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="55" y="175" width="205" height="365" rx="20" fill="#e3f1ff"/></g><text x="157" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">上から下へ</text><rect x="92" y="270" width="130" height="130" rx="14" fill="#fff"/><text x="157" y="365" text-anchor="middle" font-size="82" fill="#334155">三</text><circle cx="110" cy="435" r="7" fill="#4d91c7"/><text x="157" y="485" text-anchor="middle" font-size="16" fill="#526579">原則のイメージ</text><g filter="url(#s)"><rect x="283" y="175" width="205" height="365" rx="20" fill="#e5f6ec"/></g><text x="385" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">左から右へ</text><rect x="320" y="270" width="130" height="130" rx="14" fill="#fff"/><text x="385" y="365" text-anchor="middle" font-size="82" fill="#334155">川</text><circle cx="338" cy="435" r="7" fill="#4d91c7"/><text x="385" y="485" text-anchor="middle" font-size="16" fill="#526579">原則のイメージ</text><g filter="url(#s)"><rect x="511" y="175" width="205" height="365" rx="20" fill="#fff0df"/></g><text x="613" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">横画から縦画へ</text><rect x="548" y="270" width="130" height="130" rx="14" fill="#fff"/><text x="613" y="365" text-anchor="middle" font-size="82" fill="#334155">十</text><circle cx="566" cy="435" r="7" fill="#4d91c7"/><text x="613" y="485" text-anchor="middle" font-size="16" fill="#526579">原則のイメージ</text><g filter="url(#s)"><rect x="739" y="175" width="205" height="365" rx="20" fill="#f0eaff"/></g><text x="841" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">外側から内側へ</text><rect x="776" y="270" width="130" height="130" rx="14" fill="#fff"/><text x="841" y="365" text-anchor="middle" font-size="82" fill="#334155">日</text><circle cx="794" cy="435" r="7" fill="#4d91c7"/><text x="841" y="485" text-anchor="middle" font-size="16" fill="#526579">原則のイメージ</text><g filter="url(#s)"><rect x="967" y="175" width="205" height="365" rx="20" fill="#fff0f0"/></g><text x="1069" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">中を書いて閉じる</text><rect x="1004" y="270" width="130" height="130" rx="14" fill="#fff"/><text x="1069" y="365" text-anchor="middle" font-size="82" fill="#334155">国</text><circle cx="1022" cy="435" r="7" fill="#4d91c7"/><text x="1069" y="485" text-anchor="middle" font-size="16" fill="#526579">原則のイメージ</text>
<text x="600" y="630" text-anchor="middle" font-size="19" fill="#64748b">筆順には例外もあります。複雑な漢字は、正しい筆順の教材で確認しましょう。</text>
