<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">漢字の熟語：組み合わせて覚える</title><desc id="desc">漢字を組み合わせると、意味が具体的になったり、新しい語ができたりする</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">漢字の熟語：組み合わせて覚える</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">漢字を組み合わせると、意味が具体的になったり、新しい語ができたりする</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="65" y="155" width="320" height="195" rx="20" fill="#e3f1ff"/></g><text x="225" y="225" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">電車</text><text x="225" y="265" text-anchor="middle" font-size="20" fill="#456783">でんしゃ</text><text x="225" y="315" text-anchor="middle" font-size="17" fill="#526579">電気で動く列車</text><g filter="url(#s)"><rect x="435" y="155" width="320" height="195" rx="20" fill="#e5f6ec"/></g><text x="595" y="225" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">読書</text><text x="595" y="265" text-anchor="middle" font-size="20" fill="#456783">どくしょ</text><text x="595" y="315" text-anchor="middle" font-size="17" fill="#526579">本を読むこと</text><g filter="url(#s)"><rect x="805" y="155" width="320" height="195" rx="20" fill="#fff0df"/></g><text x="965" y="225" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">山道</text><text x="965" y="265" text-anchor="middle" font-size="20" fill="#456783">やまみち</text><text x="965" y="315" text-anchor="middle" font-size="17" fill="#526579">山の中を通る道</text><g filter="url(#s)"><rect x="65" y="400" width="320" height="195" rx="20" fill="#f0eaff"/></g><text x="225" y="470" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">上下</text><text x="225" y="510" text-anchor="middle" font-size="20" fill="#456783">じょうげ</text><text x="225" y="560" text-anchor="middle" font-size="17" fill="#526579">上と下。反対の方向</text><g filter="url(#s)"><rect x="435" y="400" width="320" height="195" rx="20" fill="#fff0f0"/></g><text x="595" y="470" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">雨雲</text><text x="595" y="510" text-anchor="middle" font-size="20" fill="#456783">あまぐも</text><text x="595" y="560" text-anchor="middle" font-size="17" fill="#526579">雨を降らせる雲</text><g filter="url(#s)"><rect x="805" y="400" width="320" height="195" rx="20" fill="#e3f1ff"/></g><text x="965" y="470" text-anchor="middle" font-size="40" font-weight="800" fill="#334155">学校</text><text x="965" y="510" text-anchor="middle" font-size="20" fill="#456783">がっこう</text><text x="965" y="560" text-anchor="middle" font-size="17" fill="#526579">学ぶための施設</text>
<text x="600" y="680" text-anchor="middle" font-size="18" fill="#64748b">熟語は、読み方と意味をセットにして、短い例文で使ってみましょう。</text>
</g></svg>