<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">レベルに合わせた漢字学習</title><desc id="desc">N5～N1は学習段階の目安。実際の学習範囲は教材や目標に合わせて調整する</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">レベルに合わせた漢字学習</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">N5～N1は学習段階の目安。実際の学習範囲は教材や目標に合わせて調整する</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="50" y="276" width="205" height="300" rx="18" fill="#e3f1ff"/></g><rect x="75" y="301" width="155" height="55" rx="15" fill="#8bbfdc"/><text x="152" y="339" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">N5</text><text x="152" y="406" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">身近な基本語</text><text x="152" y="461" text-anchor="middle" font-size="16" fill="#526579">日・月・人・山・水</text><g filter="url(#s)"><rect x="280" y="252" width="205" height="324" rx="18" fill="#e5f6ec"/></g><rect x="305" y="277" width="155" height="55" rx="15" fill="#79b89a"/><text x="382" y="315" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">N4</text><text x="382" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">生活で使う語</text><text x="382" y="437" text-anchor="middle" font-size="16" fill="#526579">駅・会社・家族・時間</text><g filter="url(#s)"><rect x="510" y="228" width="205" height="348" rx="18" fill="#fff0df"/></g><rect x="535" y="253" width="155" height="55" rx="15" fill="#e1b16f"/><text x="612" y="291" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">N3</text><text x="612" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">日常・社会の語</text><text x="612" y="413" text-anchor="middle" font-size="16" fill="#526579">予定・経験・必要・説明</text><g filter="url(#s)"><rect x="740" y="204" width="205" height="372" rx="18" fill="#f0eaff"/></g><rect x="765" y="229" width="155" height="55" rx="15" fill="#a899d3"/><text x="842" y="267" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">N2</text><text x="842" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">幅広い話題の語</text><text x="842" y="389" text-anchor="middle" font-size="16" fill="#526579">制度・影響・状況・比較</text><g filter="url(#s)"><rect x="970" y="180" width="205" height="396" rx="18" fill="#fff0f0"/></g><rect x="995" y="205" width="155" height="55" rx="15" fill="#d48a91"/><text x="1072" y="243" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">N1</text><text x="1072" y="310" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">抽象的・高度な語</text><text x="1072" y="365" text-anchor="middle" font-size="16" fill="#526579">概念・傾向・促進・懸念</text>
<text x="600" y="680" text-anchor="middle" font-size="18" fill="#64748b">ここに示した漢字は学習例であり、JLPTの公式漢字一覧や出題範囲を示すものではありません。</text>
</g></svg>