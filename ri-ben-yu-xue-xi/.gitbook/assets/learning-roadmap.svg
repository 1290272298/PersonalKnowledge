<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">日本語学習ロードマップ</title><desc id="desc">現在の力を確認しながら、基礎から応用へ段階的に学ぶための目安</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">日本語学習ロードマップ</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">現在の力を確認しながら、基礎から応用へ段階的に学ぶための目安</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="48" y="210" width="190" height="330" rx="22" fill="#e8f2ff"/></g><rect x="72" y="238" width="142" height="64" rx="18" fill="#4b8bc8"/><text x="143" y="281" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">N5</text><text x="143" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">基礎を身につける</text><text x="143" y="407" text-anchor="middle" font-size="17" fill="#526579">文字・基本文型</text><path d="M143 445 v40" stroke="#9aa9b8" stroke-width="4" stroke-linecap="round"/><circle cx="143" cy="495" r="8" fill="#4b8bc8"/><g filter="url(#s)"><rect x="276" y="210" width="190" height="330" rx="22" fill="#e8f6ee"/></g><rect x="300" y="238" width="142" height="64" rx="18" fill="#4d9d79"/><text x="371" y="281" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">N4</text><text x="371" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">日常表現を広げる</text><text x="371" y="407" text-anchor="middle" font-size="17" fill="#526579">生活場面の会話</text><path d="M371 445 v40" stroke="#9aa9b8" stroke-width="4" stroke-linecap="round"/><circle cx="371" cy="495" r="8" fill="#4d9d79"/><g filter="url(#s)"><rect x="504" y="210" width="190" height="330" rx="22" fill="#fff1df"/></g><rect x="528" y="238" width="142" height="64" rx="18" fill="#d79b48"/><text x="599" y="281" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">N3</text><text x="599" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">実用力を高める</text><text x="599" y="407" text-anchor="middle" font-size="17" fill="#526579">自然な文章・会話</text><path d="M599 445 v40" stroke="#9aa9b8" stroke-width="4" stroke-linecap="round"/><circle cx="599" cy="495" r="8" fill="#d79b48"/><g filter="url(#s)"><rect x="732" y="210" width="190" height="330" rx="22" fill="#f0eaff"/></g><rect x="756" y="238" width="142" height="64" rx="18" fill="#8068bd"/><text x="827" y="281" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">N2</text><text x="827" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">幅広い話題に対応</text><text x="827" y="407" text-anchor="middle" font-size="17" fill="#526579">説明文・意見文</text><path d="M827 445 v40" stroke="#9aa9b8" stroke-width="4" stroke-linecap="round"/><circle cx="827" cy="495" r="8" fill="#8068bd"/><g filter="url(#s)"><rect x="960" y="210" width="190" height="330" rx="22" fill="#fff0f0"/></g><rect x="984" y="238" width="142" height="64" rx="18" fill="#c46c79"/><text x="1055" y="281" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">N1</text><text x="1055" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">高度な表現を理解</text><text x="1055" y="407" text-anchor="middle" font-size="17" fill="#526579">抽象的・専門的内容</text><path d="M1055 445 v40" stroke="#9aa9b8" stroke-width="4" stroke-linecap="round"/><circle cx="1055" cy="495" r="8" fill="#c46c79"/>
<path d="M175 565 H1025" stroke="#b9c5d1" stroke-width="5" stroke-linecap="round"/><path d="M1010 551 L1030 565 L1010 579" fill="none" stroke="#b9c5d1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="635" text-anchor="middle" font-size="20" fill="#42566c">学習の進み方は人それぞれ。得意・不得意に合わせて復習を組み合わせましょう。</text>
</g></svg>