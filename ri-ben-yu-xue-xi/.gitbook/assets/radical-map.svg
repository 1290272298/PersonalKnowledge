<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">漢字の部首：意味の手がかり</title><desc id="desc">部首は漢字を整理する手がかり。意味を推測する助けになることがある</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">漢字の部首：意味の手がかり</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">部首は漢字を整理する手がかり。意味を推測する助けになることがある</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="75" y="150" width="490" height="205" rx="22" fill="#e3f1ff"/></g><rect x="105" y="185" width="92" height="92" rx="16" fill="#fff"/><text x="151" y="248" text-anchor="middle" font-size="42" font-weight="700" fill="#456783">氵</text><text x="245" y="220" font-size="27" font-weight="700" fill="#334155">さんずい</text><text x="245" y="260" font-size="18" fill="#526579">水に関係する漢字</text><text x="245" y="310" font-size="24" font-weight="700" fill="#456783">海・河・湖</text><g filter="url(#s)"><rect x="615" y="150" width="490" height="205" rx="22" fill="#e5f6ec"/></g><rect x="645" y="185" width="92" height="92" rx="16" fill="#fff"/><text x="691" y="248" text-anchor="middle" font-size="42" font-weight="700" fill="#456783">亻</text><text x="785" y="220" font-size="27" font-weight="700" fill="#334155">にんべん</text><text x="785" y="260" font-size="18" fill="#526579">人に関係する漢字</text><text x="785" y="310" font-size="24" font-weight="700" fill="#456783">休・体・住</text><g filter="url(#s)"><rect x="75" y="400" width="490" height="205" rx="22" fill="#fff0df"/></g><rect x="105" y="435" width="92" height="92" rx="16" fill="#fff"/><text x="151" y="498" text-anchor="middle" font-size="42" font-weight="700" fill="#456783">木</text><text x="245" y="470" font-size="27" font-weight="700" fill="#334155">きへん</text><text x="245" y="510" font-size="18" fill="#526579">木に関係する漢字</text><text x="245" y="560" font-size="24" font-weight="700" fill="#456783">林・板・校</text><g filter="url(#s)"><rect x="615" y="400" width="490" height="205" rx="22" fill="#f0eaff"/></g><rect x="645" y="435" width="92" height="92" rx="16" fill="#fff"/><text x="691" y="498" text-anchor="middle" font-size="42" font-weight="700" fill="#456783">艹</text><text x="785" y="470" font-size="27" font-weight="700" fill="#334155">くさかんむり</text><text x="785" y="510" font-size="18" fill="#526579">植物に関係する漢字</text><text x="785" y="560" font-size="24" font-weight="700" fill="#456783">花・草・茶</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">部首は意味を考えるヒントですが、すべての漢字の意味を直接説明するわけではありません。</text>
</g></svg>