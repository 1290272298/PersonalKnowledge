<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">復習サイクルを作る</title><desc id="desc">学んだ内容を時間を空けて思い出し、忘れにくくする</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">復習サイクルを作る</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">学んだ内容を時間を空けて思い出し、忘れにくくする</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="55" y="215" width="205" height="245" rx="20" fill="#e3f1ff"/></g><circle cx="157" cy="280" r="35" fill="#fff"/><text x="157" y="290" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">1</text><text x="157" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">学習当日</text><text x="157" y="410" text-anchor="middle" font-size="17" fill="#526579">内容を整理する</text><g filter="url(#s)"><rect x="285" y="215" width="205" height="245" rx="20" fill="#e5f6ec"/></g><circle cx="387" cy="280" r="35" fill="#fff"/><text x="387" y="290" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">2</text><text x="387" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">翌日</text><text x="387" y="410" text-anchor="middle" font-size="17" fill="#526579">何も見ずに思い出す</text><g filter="url(#s)"><rect x="515" y="215" width="205" height="245" rx="20" fill="#fff0df"/></g><circle cx="617" cy="280" r="35" fill="#fff"/><text x="617" y="290" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">3</text><text x="617" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">3日後</text><text x="617" y="410" text-anchor="middle" font-size="17" fill="#526579">例文や問題で確認</text><g filter="url(#s)"><rect x="745" y="215" width="205" height="245" rx="20" fill="#f0eaff"/></g><circle cx="847" cy="280" r="35" fill="#fff"/><text x="847" y="290" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">4</text><text x="847" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">1週間後</text><text x="847" y="410" text-anchor="middle" font-size="17" fill="#526579">間違いを中心に復習</text><g filter="url(#s)"><rect x="975" y="215" width="205" height="245" rx="20" fill="#fff0f0"/></g><circle cx="1077" cy="280" r="35" fill="#fff"/><text x="1077" y="290" text-anchor="middle" font-size="23" font-weight="800" fill="#456783">5</text><text x="1077" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">1か月後</text><text x="1077" y="410" text-anchor="middle" font-size="17" fill="#526579">定着度をチェック</text>
<text x="600" y="565" text-anchor="middle" font-size="18" fill="#64748b">復習間隔は一例です。覚えにくい内容は短い間隔で繰り返しましょう。</text>
</g></svg>