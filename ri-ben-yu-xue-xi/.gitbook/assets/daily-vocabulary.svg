<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">日常生活の基本語彙</title><desc id="desc">身近な場面ごとに単語をまとめ、短い文で使ってみる</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">日常生活の基本語彙</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">身近な場面ごとに単語をまとめ、短い文で使ってみる</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="95" y="155" width="450" height="195" rx="22" fill="#e3f1ff"/></g><circle cx="175" cy="230" r="42" fill="#fff"/><text x="175" y="244" text-anchor="middle" font-size="34" font-weight="700" fill="#4d6982">⌂</text><text x="390" y="220" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">家・生活</text><text x="390" y="275" text-anchor="middle" font-size="19" fill="#526579">部屋／台所／洗濯／掃除</text><g filter="url(#s)"><rect x="615" y="155" width="450" height="195" rx="22" fill="#fff1df"/></g><circle cx="695" cy="230" r="42" fill="#fff"/><text x="695" y="244" text-anchor="middle" font-size="34" font-weight="700" fill="#4d6982">食</text><text x="910" y="220" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">食べ物</text><text x="910" y="275" text-anchor="middle" font-size="19" fill="#526579">ご飯／野菜／飲み物／料理</text><g filter="url(#s)"><rect x="95" y="400" width="450" height="195" rx="22" fill="#e5f6ec"/></g><circle cx="175" cy="475" r="42" fill="#fff"/><text x="175" y="489" text-anchor="middle" font-size="34" font-weight="700" fill="#4d6982">→</text><text x="390" y="465" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">交通</text><text x="390" y="520" text-anchor="middle" font-size="19" fill="#526579">駅／電車／乗り換え／切符</text><g filter="url(#s)"><rect x="615" y="400" width="450" height="195" rx="22" fill="#f0eaff"/></g><circle cx="695" cy="475" r="42" fill="#fff"/><text x="695" y="489" text-anchor="middle" font-size="34" font-weight="700" fill="#4d6982">☀</text><text x="910" y="465" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">天気</text><text x="910" y="520" text-anchor="middle" font-size="19" fill="#526579">晴れ／曇り／雨／気温</text>
<text x="600" y="680" text-anchor="middle" font-size="19" fill="#64748b">新しい単語は「場面・意味・例文」を一緒に記録すると復習しやすくなります。</text>
</g></svg>