<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">音読み・訓読み</title><desc id="desc">漢字の読み方は、熟語の中か単独か、語の成り立ちなどで変わる</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">音読み・訓読み</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">漢字の読み方は、熟語の中か単独か、語の成り立ちなどで変わる</text>
<g font-family="sans-serif">
<text x="315" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#3977ad">音読み（例）</text>
<text x="885" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#438a68">訓読み（例）</text>
<g filter="url(#s)"><rect x="70" y="205" width="1060" height="86" rx="16" fill="#fff"/></g><text x="125" y="260" font-size="42" font-weight="700" fill="#334155">山</text><text x="315" y="255" text-anchor="middle" font-size="24" fill="#3977ad">さん</text><text x="885" y="255" text-anchor="middle" font-size="24" fill="#438a68">やま</text><text x="480" y="255" text-anchor="middle" font-size="17" fill="#64748b">富士山（ふじさん）</text><text x="1030" y="255" text-anchor="middle" font-size="17" fill="#64748b">山（やま）</text><g filter="url(#s)"><rect x="70" y="310" width="1060" height="86" rx="16" fill="#fff"/></g><text x="125" y="365" font-size="42" font-weight="700" fill="#334155">水</text><text x="315" y="360" text-anchor="middle" font-size="24" fill="#3977ad">すい</text><text x="885" y="360" text-anchor="middle" font-size="24" fill="#438a68">みず</text><text x="480" y="360" text-anchor="middle" font-size="17" fill="#64748b">水曜日（すいようび）</text><text x="1030" y="360" text-anchor="middle" font-size="17" fill="#64748b">水（みず）</text><g filter="url(#s)"><rect x="70" y="415" width="1060" height="86" rx="16" fill="#fff"/></g><text x="125" y="470" font-size="42" font-weight="700" fill="#334155">学</text><text x="315" y="465" text-anchor="middle" font-size="24" fill="#3977ad">がく</text><text x="885" y="465" text-anchor="middle" font-size="24" fill="#438a68">まなぶ</text><text x="480" y="465" text-anchor="middle" font-size="17" fill="#64748b">学生（がくせい）</text><text x="1030" y="465" text-anchor="middle" font-size="17" fill="#64748b">学ぶ（まなぶ）</text><g filter="url(#s)"><rect x="70" y="520" width="1060" height="86" rx="16" fill="#fff"/></g><text x="125" y="575" font-size="42" font-weight="700" fill="#334155">生</text><text x="315" y="570" text-anchor="middle" font-size="24" fill="#3977ad">せい・しょう</text><text x="885" y="570" text-anchor="middle" font-size="24" fill="#438a68">いきる・うまれる</text><text x="480" y="570" text-anchor="middle" font-size="17" fill="#64748b">学生（がくせい）</text><text x="1030" y="570" text-anchor="middle" font-size="17" fill="#64748b">生きる（いきる）</text>
<text x="600" y="665" text-anchor="middle" font-size="18" fill="#64748b">一つの漢字に複数の読み方がある場合があります。語全体で読み方を覚えましょう。</text>
</g></svg>