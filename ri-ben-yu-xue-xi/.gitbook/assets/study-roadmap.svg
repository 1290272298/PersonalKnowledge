<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">JLPT学習の進め方</title><desc id="desc">目標設定から復習まで、学習サイクルを繰り返す</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">JLPT学習の進め方</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">目標設定から復習まで、学習サイクルを繰り返す</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="70" y="215" width="245" height="260" rx="22" fill="#e3f1ff"/></g><circle cx="192" cy="275" r="38" fill="#fff"/><text x="192" y="285" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">01</text><text x="192" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">目標を決める</text><text x="192" y="410" text-anchor="middle" font-size="17" fill="#526579">受験級・学習期間・現在地</text><path d="M318 345 h25 m-10 -12 l12 12 -12 12" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="350" y="215" width="245" height="260" rx="22" fill="#e5f6ec"/></g><circle cx="472" cy="275" r="38" fill="#fff"/><text x="472" y="285" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">02</text><text x="472" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">基礎を学ぶ</text><text x="472" y="410" text-anchor="middle" font-size="17" fill="#526579">語彙・漢字・文法を整理</text><path d="M598 345 h25 m-10 -12 l12 12 -12 12" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="630" y="215" width="245" height="260" rx="22" fill="#fff0df"/></g><circle cx="752" cy="275" r="38" fill="#fff"/><text x="752" y="285" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">03</text><text x="752" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">問題で試す</text><text x="752" y="410" text-anchor="middle" font-size="17" fill="#526579">読解・聴解・時間配分</text><path d="M878 345 h25 m-10 -12 l12 12 -12 12" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="910" y="215" width="245" height="260" rx="22" fill="#f0eaff"/></g><circle cx="1032" cy="275" r="38" fill="#fff"/><text x="1032" y="285" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">04</text><text x="1032" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">弱点を復習</text><text x="1032" y="410" text-anchor="middle" font-size="17" fill="#526579">間違いの理由を記録</text>
<path d="M1030 520 Q1030 600 600 600 Q170 600 170 520" fill="none" stroke="#a9b9c9" stroke-width="4" stroke-dasharray="10 10"/><text x="600" y="650" text-anchor="middle" font-size="22" font-weight="700" fill="#526579">復習した内容を次の学習計画へ反映する</text>
</g></svg>