<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">報連相：仕事を円滑に進める</title><desc id="desc">報告・連絡・相談を、タイミングと相手に合わせて行う</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">報連相：仕事を円滑に進める</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">報告・連絡・相談を、タイミングと相手に合わせて行う</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="70" y="170" width="320" height="370" rx="22" fill="#e3f1ff"/></g><circle cx="230" cy="250" r="42" fill="#4b8bc8"/><text x="230" y="262" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="230" y="340" text-anchor="middle" font-size="30" font-weight="800" fill="#334155">報告</text><text x="230" y="395" text-anchor="middle" font-size="18" fill="#526579">進捗・結果・問題を伝える</text><rect x="95" y="440" width="270" height="70" rx="12" fill="#fff"/><text x="230" y="482" text-anchor="middle" font-size="16" fill="#40566e">例：作業が完了しました。</text><g filter="url(#s)"><rect x="435" y="170" width="320" height="370" rx="22" fill="#e5f6ec"/></g><circle cx="595" cy="250" r="42" fill="#4d9d79"/><text x="595" y="262" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="595" y="340" text-anchor="middle" font-size="30" font-weight="800" fill="#334155">連絡</text><text x="595" y="395" text-anchor="middle" font-size="18" fill="#526579">関係者へ必要な情報を共有する</text><rect x="460" y="440" width="270" height="70" rx="12" fill="#fff"/><text x="595" y="482" text-anchor="middle" font-size="16" fill="#40566e">例：開始時刻が変更になりました。</text><g filter="url(#s)"><rect x="800" y="170" width="320" height="370" rx="22" fill="#fff0df"/></g><circle cx="960" cy="250" r="42" fill="#d79b48"/><text x="960" y="262" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="960" y="340" text-anchor="middle" font-size="30" font-weight="800" fill="#334155">相談</text><text x="960" y="395" text-anchor="middle" font-size="18" fill="#526579">判断に迷う点を早めに確認する</text><rect x="825" y="440" width="270" height="70" rx="12" fill="#fff"/><text x="960" y="482" text-anchor="middle" font-size="16" fill="#40566e">例：この方法で進めてもよいですか。</text>
<text x="600" y="635" text-anchor="middle" font-size="19" fill="#64748b">問題や遅れは、事実・影響・次の対応案を整理して早めに共有しましょう。</text>
</g></svg>