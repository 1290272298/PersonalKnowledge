<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ビジネス電話の基本フロー</title><desc id="desc">相手の会社名・氏名・用件を確認し、必要な情報を正確に伝える</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">ビジネス電話の基本フロー</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">相手の会社名・氏名・用件を確認し、必要な情報を正確に伝える</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="105" y="145" width="990" height="100" rx="18" fill="#e3f1ff"/></g><circle cx="165" cy="195" r="29" fill="#fff"/><text x="165" y="204" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">1</text><text x="225" y="185" font-size="23" font-weight="700" fill="#334155">電話に出る</text><text x="590" y="204" font-size="18" fill="#526579">お電話ありがとうございます。</text><g filter="url(#s)"><rect x="105" y="273" width="990" height="100" rx="18" fill="#e5f6ec"/></g><circle cx="165" cy="323" r="29" fill="#fff"/><text x="165" y="332" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">2</text><text x="225" y="313" font-size="23" font-weight="700" fill="#334155">名乗る・確認する</text><text x="590" y="332" font-size="18" fill="#526579">会社名と自分の名前を伝える</text><g filter="url(#s)"><rect x="105" y="401" width="990" height="100" rx="18" fill="#fff0df"/></g><circle cx="165" cy="451" r="29" fill="#fff"/><text x="165" y="460" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">3</text><text x="225" y="441" font-size="23" font-weight="700" fill="#334155">用件を聞く・取り次ぐ</text><text x="590" y="460" font-size="18" fill="#526579">少々お待ちいただけますか。</text><g filter="url(#s)"><rect x="105" y="529" width="990" height="100" rx="18" fill="#f0eaff"/></g><circle cx="165" cy="579" r="29" fill="#fff"/><text x="165" y="588" text-anchor="middle" font-size="24" font-weight="800" fill="#456783">4</text><text x="225" y="569" font-size="23" font-weight="700" fill="#334155">復唱して終える</text><text x="590" y="588" font-size="18" fill="#526579">承知いたしました。失礼いたします。</text>
<text x="600" y="690" text-anchor="middle" font-size="18" fill="#64748b">日時・氏名・数字・折り返し先は、必要に応じて復唱して確認します。</text>
</g></svg>