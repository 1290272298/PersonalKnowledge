<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">敬語の3つの基本</title><desc id="desc">同じ内容でも、誰の行動を述べるか、相手との関係で表現が変わる</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".10"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#26384d">敬語の3つの基本</text><text x="600" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#64748b">同じ内容でも、誰の行動を述べるか、相手との関係で表現が変わる</text>
<g font-family="sans-serif">
<g filter="url(#s)"><rect x="75" y="175" width="320" height="360" rx="22" fill="#e3f1ff"/></g><rect x="110" y="210" width="250" height="58" rx="16" fill="#4b8bc8"/><text x="235" y="248" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">尊敬語</text><text x="235" y="330" text-anchor="middle" font-size="18" fill="#526579">相手・目上の人の行動を高める</text><rect x="105" y="390" width="260" height="90" rx="14" fill="#fff"/><text x="235" y="445" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">先生がいらっしゃいます。</text><g filter="url(#s)"><rect x="440" y="175" width="320" height="360" rx="22" fill="#e5f6ec"/></g><rect x="475" y="210" width="250" height="58" rx="16" fill="#4d9d79"/><text x="600" y="248" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">謙譲語</text><text x="600" y="330" text-anchor="middle" font-size="18" fill="#526579">自分側の行動をへりくだって述べる</text><rect x="470" y="390" width="260" height="90" rx="14" fill="#fff"/><text x="600" y="445" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">私が伺います。</text><g filter="url(#s)"><rect x="805" y="175" width="320" height="360" rx="22" fill="#fff0df"/></g><rect x="840" y="210" width="250" height="58" rx="16" fill="#d79b48"/><text x="965" y="248" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">丁寧語</text><text x="965" y="330" text-anchor="middle" font-size="18" fill="#526579">聞き手に丁寧に伝える</text><rect x="835" y="390" width="260" height="90" rx="14" fill="#fff"/><text x="965" y="445" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">明日、行きます。</text>
<text x="600" y="635" text-anchor="middle" font-size="19" fill="#64748b">敬語は形だけでなく、相手・場面・自分側／相手側の区別を意識して使いましょう。</text>
</g></svg>